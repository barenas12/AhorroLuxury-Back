name: Security Checks

# Cuándo se ejecuta:
# - En cada push a main
# - En cada Pull Request hacia main
# - Cada lunes a las 7:00 a.m. Colombia (12:00 UTC), por si aparecen vulnerabilidades nuevas
# - Manualmente desde la pestaña Actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Secretos expuestos (claves, tokens, .env) en el código y en TODO el historial
  gitleaks:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para revisar el historial completo
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Si el repo pertenece a una organización, Gitleaks pide una licencia gratuita:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 2) Análisis estático del código (SAST)
  semgrep:
    name: Semgrep (código)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejs \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error

  # 3) Dependencias vulnerables
  npm-audit:
    name: npm audit (dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm ci
      - name: Auditar dependencias
        # Falla solo con vulnerabilidades altas o críticas.
        # Para ignorar las de desarrollo, agrega: --omit=dev
        run: npm audit --audit-level=high